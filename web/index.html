<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Green Yuva">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>


  <title>Green Yuva — Climate Action & Sustainability Platform</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #E8E6E1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #preloader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .badge-card {
      background: #98FF98;
      border: 3.5px solid #000;
      border-radius: 16px;
      padding: 24px 32px;
      box-shadow: 6px 6px 0px #000;
      margin-bottom: 24px;
      max-width: 320px;
    }
    .badge-title {
      font-size: 28px;
      font-weight: 900;
      color: #000;
      margin: 0 0 8px 0;
      letter-spacing: -0.5px;
    }
    .badge-subtitle {
      font-size: 14px;
      font-weight: 700;
      color: #333;
      margin: 0;
    }
    .progress-bar-container {
      width: 200px;
      height: 12px;
      background: #FFF;
      border: 2.5px solid #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #000;
      margin-bottom: 12px;
    }
    .progress-bar-fill {
      width: 100%;
      height: 100%;
      background: #00CC66;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(100%); }
    }
    .loading-hint {
      font-size: 13px;
      font-weight: 600;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="badge-card">
      <img src="favicon.png" width="68" height="68" style="margin-bottom: 12px; display: block; margin-left: auto; margin-right: auto;" alt="Green Yuva Logo" />
      <h1 class="badge-title">Green Yuva</h1>
      <p class="badge-subtitle">Youth Climate Action Platform</p>
      <a href="/GreenYuva.apk" download style="display:inline-block;margin-top:14px;background:#FFE800;color:#000;font-weight:900;text-decoration:none;padding:10px 18px;border:3px solid #000;border-radius:10px;box-shadow:3px 3px 0px #000;font-size:13px;letter-spacing:0.5px;">📥 Download Android APK (31 MB)</a>
    </div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="loading-hint">Starting app engine...</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var p = document.getElementById('preloader');
      if (p) p.style.display = 'none';
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
